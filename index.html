<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>IO chat</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="style.css">
   <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
   <script src="/socket.io/socket.io.js"></script>
</head>
<body>
   <div class="container">
      <div class="row">
         <div class="col-md-4">
            <div class="well">
               <h3>Online Users</h3>
               <ul class="list-group" id="users">
               </ul>
            </div>
         </div>
         <div class="col-md-8">
            <div class="chat id" id="chat">
               <br action="" id="messageform">
                  <div class="form-group">
                     <label>Enter Message</label>
                     <textarea class="form-control" id="message"></textarea>
                  </div></br>
                  <input type="submit" class="btn btn-primary" value="Send message"/>
               </form>
            </div>
         </div>
      </div>
   </div>
   <script>
      $(function(){
      var socket=io.connect();
      var $messageForm=$("#messageform"); // get data from the form
      var $message=$("#message");
      var $chat=$("#chat");

      $messageForm.submit(function(e){  //form btn click event handler
         e.preventDefault();  //prevent default form submission
         socket.emit("send message", $message.val()); //trap data from form txt box, call server
         $message.val("");  //clear the form txt box
         console.log('submitted')
      });
      socket.on("new message", function(data){
         $chat.append('<div class="well">'+data.msg+'</div>');
      });
   });
   </script>
</body>
</html>
